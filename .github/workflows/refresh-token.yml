name: Refresh Instagram token

# Instagram long-lived tokens last 60 days. Refreshing weekly keeps the bot running forever.
on:
  schedule:
    - cron: "23 3 * * 1"   # every Monday 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Refresh token and save it back to the repository secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python -m bot.refresh_token "$RUNNER_TEMP/new_token.txt"
          echo "::add-mask::$(cat "$RUNNER_TEMP/new_token.txt")"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/new_token.txt"
          rm -f "$RUNNER_TEMP/new_token.txt"
          echo "IG_ACCESS_TOKEN secret updated."
